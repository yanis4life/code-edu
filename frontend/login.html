<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CodeEdu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="viewport">
  <div class="shell" style="max-width:480px;margin:4rem auto;padding:3rem">
    <div class="glow-sphere" style="top:-100px;right:-100px"></div>
    <div style="text-align:center;margin-bottom:2rem;position:relative;z-index:1">
      <a href="/" class="nav-logo" style="justify-content:center;margin-bottom:1rem;font-size:1.5rem">
        <div class="logo-box" style="width:48px;height:48px;font-size:1.3rem">C</div>
        <span>CodeEdu</span>
      </a>
      <div class="section-label" style="font-size:0.8rem">Welcome Back</div>
      <h2 class="section-title" style="font-size:1.75rem">Login to <span>Continue</span></h2>
    </div>
    <form id="loginForm" style="position:relative;z-index:1">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
      </div>
      <div class="form-error" style="text-align:center;margin-bottom:1rem"></div>
      <button type="submit" class="neon-btn" style="width:100%;justify-content:center;padding:1rem">Login</button>
    </form>
    <div style="text-align:center;margin-top:1.5rem;position:relative;z-index:1">
      <span class="bento-desc">Don't have an account? </span>
      <a href="/register" style="color:var(--accent-lime);font-weight:600">Sign Up</a>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
