<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - CodeEdu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="viewport">
  <div class="shell" style="max-width:480px;margin:2rem auto;padding:3rem">
        <div style="text-align:center;margin-bottom:2rem;position:relative;z-index:1">
      <a href="/" class="nav-logo" style="justify-content:center;margin-bottom:1rem;font-size:1.5rem">
        <div class="logo-box" style="width:48px;height:48px;font-size:1.3rem">C</div>
        <span>CodeEdu</span>
      </a>
      <div class="section-label" style="font-size:0.8rem">Start Your Journey</div>
      <h2 class="section-title" style="font-size:1.75rem">Create <span>Account</span></h2>
    </div>
    <form id="registerForm" style="position:relative;z-index:1">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="regUsername" class="form-input" placeholder="Choose a username" required minlength="3">
      </div>
      <div class="form-group">
        <label class="form-label">Display Name</label>
        <input type="text" id="regDisplayName" class="form-input" placeholder="Your display name (optional)">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="regEmail" class="form-input" placeholder="Your email address" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="regPassword" class="form-input" placeholder="Create a password (min 8 chars)" required minlength="8">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" id="regConfirm" class="form-input" placeholder="Confirm your password" required>
      </div>
      <div class="form-error" style="text-align:center;margin-bottom:1rem"></div>
      <button type="submit" class="neon-btn" style="width:100%;justify-content:center;padding:1rem">Create Account</button>
    </form>
    <div style="text-align:center;margin-top:1.5rem;position:relative;z-index:1">
      <span class="bento-desc">Already have an account? </span>
      <a href="/login" style="color:var(--accent-lime);font-weight:600">Login</a>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
