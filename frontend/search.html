<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search - CodeEdu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="viewport">
  <div class="shell">
    <div class="glow-sphere" style="top:-200px;right:-200px"></div>
    <nav class="nav">
      <a href="/" class="nav-logo">
        <div class="logo-box">C</div>
        <span>CodeEdu</span>
      </a>
      <div class="nav-pill">
        <a href="/dashboard">Dashboard</a>
        <a href="/lessons">Learn</a>
        <a href="/leaderboard">Leaderboard</a>
      </div>
    </nav>

    <section class="section">
      <div class="section-header">
        <div class="section-label">Search</div>
        <h2 class="section-title">Find <span>Anything</span></h2>
      </div>
      <div class="bento-card" style="margin-bottom:2rem">
        <div style="display:flex;gap:1rem;align-items:center">
          <i class="fas fa-search" style="color:var(--text-muted)"></i>
          <input type="text" id="searchInput" class="form-input" placeholder="Search lessons, users, challenges..." style="border:none;background:transparent;padding:0.5rem 0;font-size:1.1rem">
        </div>
      </div>
      <div id="searchContent"></div>
    </section>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script src="/js/dashboard.js"></script>
<script>document.addEventListener('DOMContentLoaded', loadSearch);</script>
</body>
</html>
