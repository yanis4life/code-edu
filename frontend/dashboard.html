<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - CodeEdu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="viewport">
  <div class="shell">
    <div class="glow-sphere" style="top:-200px;right:-200px"></div>
    <nav class="nav">
      <a href="/" class="nav-logo">
        <div class="logo-box">C</div>
        <span>CodeEdu</span>
      </a>
      <div class="nav-pill">
        <a href="/dashboard" class="active">Dashboard</a>
        <a href="/lessons">Learn</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/contests">Contests</a>
      </div>
      <div class="nav-right" id="userMenu" style="display:none">
        <div class="status-tag"><span class="status-dot"></span><span>Online</span></div>
        <a href="/profile" class="nav-logo" style="font-size:0.9rem">
          <img class="user-menu-avatar" style="width:32px;height:32px;border-radius:50%;object-fit:cover" src="">
          <span class="user-menu-name"></span>
        </a>
        <button id="logoutBtn" class="glass-btn" style="padding:0.5rem 1rem;font-size:0.75rem">Logout</button>
      </div>
    </nav>

    <section class="section">
      <div class="section-header">
        <div class="section-label">Dashboard</div>
        <h2 class="section-title">Your <span>Progress</span></h2>
      </div>
      <div id="dashboardContent"></div>
    </section>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
<script>document.addEventListener('DOMContentLoaded', loadDashboard);</script>
</body>
</html>
