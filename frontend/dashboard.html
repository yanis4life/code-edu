<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - CodeEdu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="viewport">
  <div class="shell">
        <nav class="nav">
      <a href="/" class="nav-logo" id="logoLink">
        <div class="logo-box">C</div>
        <span>CodeEdu</span>
      </a>
      <div class="nav-pill">
        <a href="/dashboard" class="active">Dashboard</a>
        <a href="/lessons">Learn</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/contests">Contests</a>
      </div>
      <div class="nav-right" id="userMenu" style="display:none">
        <div class="status-tag"><span class="status-dot"></span><span>Online</span></div>
        <a href="/profile" class="nav-logo" style="font-size:0.9rem">
          <img class="user-menu-avatar" style="width:32px;height:32px;border-radius:50%;object-fit:cover" src="">
          <span class="user-menu-name"></span>
        </a>
        <button id="logoutBtn" class="glass-btn" style="padding:0.4rem 0.75rem;font-size:0.7rem">Logout</button>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
    </nav>
    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="/dashboard" onclick="toggleMenu()">Dashboard</a>
      <a href="/lessons" onclick="toggleMenu()">Learn</a>
      <a href="/leaderboard" onclick="toggleMenu()">Leaderboard</a>
      <a href="/contests" onclick="toggleMenu()">Contests</a>
      <a href="/projects" onclick="toggleMenu()">Projects</a>
      <a href="/search" onclick="toggleMenu()">Search</a>
      <a href="/profile" onclick="toggleMenu()">Profile</a>
      <a href="/settings" onclick="toggleMenu()">Settings</a>
      <div class="mobile-user" id="mobileUser" style="display:none">
        <img class="user-menu-avatar" src="">
        <span class="user-menu-name"></span>
      </div>
    </div>
    <section class="section">
      <div class="section-header">
        <div class="section-label">Dashboard</div>
        <h2 class="section-title">Your <span>Progress</span></h2>
      </div>
      <div id="dashboardContent"></div>
    </section>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
<script>document.addEventListener('DOMContentLoaded', loadDashboard);</script>
</body>
</html>
