name: Deploy to Cloudflare (code-edu.cc.cd)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: npm install

      - name: Detect schema or seed changes
        id: changes
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "seed=true" >> "$GITHUB_OUTPUT"
          else
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
               | grep -qE '^(schema\.sql|python/seed_lessons\.sql)';
            then echo "seed=true" >> "$GITHUB_OUTPUT"
            else echo "seed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Apply D1 schema
        if: steps.changes.outputs.seed == 'true'
        run: npx wrangler d1 execute code-edu-db --remote --file=schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Reseed curriculum
        if: steps.changes.outputs.seed == 'true'
        run: npx wrangler d1 execute code-edu-db --remote --file=python/seed_lessons.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy frontend --project-name code-edu --branch main

      - name: Verify deployment
        run: |
          echo "Deployed to https://code-edu.cc.cd"
          echo "API at https://code-edu.cc.cd/api/v1/health"